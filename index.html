<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bubble Reactor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D0F1A;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      /* Wird per JS auf exakte 16:9 Größe gesetzt */
    }

    #game-canvas {
      display: block;
      touch-action: none; /* Verhindert Browser-Scroll bei Touch */
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- Poki SDK — einziger externer Script-Tag, von Poki erlaubt -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>

  <!-- Game Module — Reihenfolge ist wichtig -->
  <script src="src/utils.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/sdk.js"></script>
  <script src="src/input.js"></script>
  <script src="src/bubble.js"></script>
  <script src="src/board.js"></script>
  <script src="src/explosion.js"></script>
  <script src="src/particles.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/upgrades.js"></script>  
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>

</body>
</html>
