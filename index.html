<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <!--
    viewport-fit=cover: iPhone Notch/Dynamic Island füllt den ganzen Screen.
    user-scalable=no:   Verhindert Pinch-Zoom auf Mobile (Poki-Anforderung).
    maximum-scale=1:    Doppelt abgesichert gegen automatisches Zoomen.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>Bubble Reactor</title>

  <style>
    /* Reset — kein Browser-Margin, kein Padding */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Seite füllt exakt den Screen, kein Scroll möglich */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Canvas wird zentriert — flexbox zentriert auf jedem Gerät */
    body {
      display: flex;
      justify-content: center;
      align-items: center;

      /* touch-action none: verhindert Browser-Scroll/Zoom durch Touches */
      touch-action: none;

      /* Kein Text-Cursor, kein Text-Select auf Mobile */
      cursor: default;
      -webkit-user-select: none;
      user-select: none;

      /* Safe-Area für iPhone mit Notch (viewport-fit=cover) */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Canvas selbst */
    #game-canvas {
      display: block;
      touch-action: none;
      /* Kein max-width/max-height — _resizeCanvas setzt die Größe per JS */
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <!--
    Poki SDK — muss als erstes Script geladen werden.
    Lokal (ohne Poki-Server) schlägt das fehl — sdk.js fängt das ab.
  -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.min.js"></script>

  <!--
    Ladereihenfolge ist wichtig:
    ui.js muss VOR renderer.js stehen (Button-Registry).
    game.js muss nach allen Modulen stehen.
  -->
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="ui.js"></script>
  <script src="bubble.js"></script>
  <script src="board.js"></script>
  <script src="explosion.js"></script>
  <script src="particles.js"></script>
  <script src="audio.js"></script>
  <script src="input.js"></script>
  <script src="sdk.js"></script>
  <script src="upgrades.js"></script>
  <script src="renderer.js"></script>
  <script src="game.js"></script>
  <script src="main.js"></script>

</body>
</html>
